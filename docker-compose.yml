x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  - ./docker:/app/docker
  - ./docker/superset_config.py:/app/pythonpath/superset_config.py

services:
    db:
        container_name: algeria_postgres_db
        image: postgres:14.17
        ports:
            - "5000:5432"
        environment:
            POSTGRES_DB: db
            POSTGRES_USER: db_user
            POSTGRES_PASSWORD: db_password
        volumes:
            - ./postgres/data:/var/lib/postgresql/data
            - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
            - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
            - ./postgres/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U db_user -d db"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - algeria_network

    airflow:
        container_name: algeria_airflow
        image: apache/airflow:3.0.0
        ports:
            - "8000:8080"
        environment:
            AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
            AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
            AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
            HOST_PROJECT_DIR: ${PWD}
            DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-algeria-weather-pipeline}_algeria_network
        volumes:
            - ./airflow/dags:/opt/airflow/dags
            - ./scripts:/opt/airflow/scripts
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            db:
                condition: service_healthy
        networks:
            - algeria_network
        command: >
            bash -c "airflow db migrate && airflow standalone"

    weather-init:
        container_name: algeria_weather_init
        image: apache/airflow:3.0.0
        command: python /opt/airflow/scripts/seed_weather.py
        environment:
            POSTGRES_HOST: db
            POSTGRES_PORT: 5432
            POSTGRES_DB: db
            POSTGRES_USER: db_user
            POSTGRES_PASSWORD: db_password
        volumes:
            - ./scripts:/opt/airflow/scripts
        depends_on:
            db:
                condition: service_healthy
        networks:
            - algeria_network

    dbt:
        container_name: algeria_dbt
        platform: linux/amd64
        image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
        volumes:
            - ./dbt/my_project:/usr/app
            - ./dbt:/root/.dbt
        environment:
            DBT_PROFILES_DIR: "/root/.dbt"
            DBT_TARGET: dev
        working_dir: /usr/app
        depends_on:
            weather-init:
                condition: service_completed_successfully
        networks:
            - algeria_network
        command: build

    superset:
        container_name: algeria_superset
        platform: linux/amd64
        image: apache/superset:3.0.0-py310
        command: ["/app/docker/docker-bootstrap.sh", "app"]
        restart: unless-stopped
        ports:
            - "8088:8088"
        user: *superset-user
        depends_on:
            superset-init:
                condition: service_completed_successfully
        volumes: *superset-volumes
        env_file:
            - path: docker/.env
              required: true
        environment:
            SUPERSET_LOG_LEVEL: ${SUPERSET_LOG_LEVEL:-info}
            DATABASE_DB: superset_db
        networks:
            - algeria_network

    superset-init:
        container_name: algeria_superset_init
        platform: linux/amd64
        image: apache/superset:3.0.0-py310
        command: ["/app/docker/docker-init.sh"]
        env_file:
            - path: docker/.env
              required: true
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            dbt:
                condition: service_completed_successfully
        user: *superset-user
        volumes: *superset-volumes
        environment:
            SUPERSET_LOAD_EXAMPLES: "no"
            SUPERSET_LOG_LEVEL: ${SUPERSET_LOG_LEVEL:-info}
            DATABASE_DB: superset_db
        healthcheck:
            disable: true
        networks:
            - algeria_network

    redis:
        container_name: algeria_redis
        image: redis:7
        restart: unless-stopped
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redis:/data
        networks:
            - algeria_network

networks:
    algeria_network:
        name: ${COMPOSE_PROJECT_NAME:-algeria-weather-pipeline}_algeria_network
        driver: bridge

volumes:
    redis:
        external: false
