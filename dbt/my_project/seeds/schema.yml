version: 2

seeds:
  - name: dim_cities
    description: "Seed dimension table containing Algerian cities, wilayas, coordinates, elevation, and climate zones."
    columns:
      - name: city_id
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - unique
          - not_null
      - name: climate_zone
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: dim_weather_codes
    description: "Seed dimension table providing descriptions and categories for WMO weather interpretation codes."
    columns:
      - name: weather_code
        tests:
          - unique
          - not_null
      - name: weather_description
        tests:
          - not_null
      - name: weather_category
        tests:
          - not_null
